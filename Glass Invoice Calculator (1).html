<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة فاتورة الزجاج</title>
    <style>
        :root {
            --color-primary: #2180CD;
            --color-primary-dark: #1a6c7d;
            --color-secondary: #32B8C6;
            --color-accent: #FF6B6B;
            --color-bg: #E8F4F8;
            --color-surface: #ffffff;
            --color-text: #1a1a1a;
            --color-border: #B3E5FC;
            --color-header: #0D47A1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--color-surface);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(33, 128, 141, 0.15);
            padding: 30px;
            border: 2px solid var(--color-border);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--color-header) 0%, var(--color-primary) 100%);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.2);
        }

        .header h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #E8F4F8 !important;
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-header);
            font-size: 14px;
        }

        input, select {
            padding: 12px;
            border: 2px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            background: #f8fbfd;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 12px rgba(33, 184, 198, 0.3);
            background: white;
        }

        .items-section {
            margin-top: 30px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .items-table thead {
            background: linear-gradient(135deg, var(--color-header) 0%, var(--color-primary) 100%);
            color: white;
        }

        .items-table th {
            padding: 12px;
            text-align: right;
            font-weight: 600;
            border: 1px solid var(--color-border);
        }

        .items-table td {
            padding: 10px;
            border: 1px solid var(--color-border);
        }

        .items-table tr:hover {
            background: #f9f9f9;
        }

        .item-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 13px;
        }

        .item-total {
            font-weight: 600;
            color: var(--color-primary);
            text-align: right;
        }

        .btn-remove {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .btn-remove:hover {
            background: #cc0000;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(50, 184, 198, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(50, 184, 198, 0.4);
        }

        .summary-section {
            background: linear-gradient(135deg, #E8F4F8 0%, #B3E5FC 100%);
            padding: 25px;
            border-radius: 12px;
            margin-top: 30px;
            border-right: 6px solid var(--color-primary);
            box-shadow: 0 4px 15px rgba(50, 184, 198, 0.15);
        }

        .summary-row {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
        }

        .summary-row label {
            margin: 0;
            color: var(--color-text);
            font-weight: 500;
        }

        .summary-value {
            text-align: left;
            font-size: 18px;
            font-weight: 600;
            color: var(--color-header);
            padding: 12px;
            background: white;
            border-radius: 6px;
            border: 2px solid var(--color-secondary);
        }

        .summary-row.total .summary-value {
            background: linear-gradient(135deg, var(--color-header) 0%, var(--color-primary) 100%);
            color: white;
            font-size: 28px;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-action {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-print {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff9800 0%, #ff6b35 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 152, 0, 0.4);
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .action-buttons {
                display: none;
            }
        }

        .tax-input-group {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
            align-items: flex-end;
        }

        .tax-input-group input {
            padding: 8px;
        }

        .tax-symbol {
            text-align: center;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>فاتورة بيع الزجاج</h1>
            <p style="color: #666;">حاسبة فاتورة تلقائية للزجاج بالجملة والتقطيع</p>
        </div>

        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label>اسم العميل</label>
                    <input type="text" id="customerName" placeholder="أدخل اسم العميل">
                </div>
                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" id="invoiceDate">
                </div>
            </div>

            <div class="form-row full">
                <div class="form-group">
                    <label>ملاحظات</label>
                    <input type="text" id="notes" placeholder="أي ملاحظات إضافية">
                </div>
            </div>
        </div>

        <div class="items-section">
            <h2 style="color: var(--color-primary); margin-bottom: 15px;">الأصناف</h2>
            <table class="items-table" id="itemsTable">
                <thead>
                    <tr>
                        <th style="width: 5%;">الحذف</th>
                        <th style="width: 15%;">الطول (متر)</th>
                        <th style="width: 15%;">العرض (متر)</th>
                        <th style="width: 15%;">السعر/م²</th>
                        <th style="width: 20%;">المساحة (م²)</th>
                        <th style="width: 30%;">المجموع</th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                </tbody>
            </table>
            <button class="btn-add" onclick="addItem()">+ إضافة صنف جديد</button>
        </div>

        <div class="summary-section">
            <div class="summary-row">
                <label>المجموع الفرعي:</label>
                <div class="summary-value" id="subtotal">0.00</div>
            </div>

            <div class="summary-row">
                <label>الضريبة (%):</label>
                <div class="tax-input-group">
                    <input type="number" id="taxRate" value="0" step="0.1" min="0" onchange="calculateTotals()">
                    <div class="tax-symbol">%</div>
                </div>
            </div>

            <div class="summary-row">
                <label>مبلغ الضريبة:</label>
                <div class="summary-value" id="taxAmount">0.00</div>
            </div>

            <div class="summary-row total">
                <label>الإجمالي النهائي:</label>
                <div class="summary-value" id="total">0.00</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-print" onclick="printInvoice()">🖨️ طباعة الفاتورة</button>
            <button class="btn-action btn-reset" onclick="resetForm()">🔄 إعادة تعيين</button>
        </div>
    </div>

    <script>
        // تعيين التاريخ الحالي
        document.getElementById('invoiceDate').valueAsDate = new Date();

        // إضافة صنف جديد
        function addItem() {
            const tbody = document.getElementById('itemsBody');
            const rowCount = tbody.rows.length;
            const newRow = tbody.insertRow();
            newRow.innerHTML = `
                <td><button class="btn-remove" onclick="removeItem(this)">×</button></td>
                <td><input type="number" class="item-input length-input" step="0.01" min="0" oninput="calculateRow(this)"></td>
                <td><input type="number" class="item-input width-input" step="0.01" min="0" oninput="calculateRow(this)"></td>
                <td><input type="number" class="item-input price-input" step="1" min="0" oninput="calculateRow(this)"></td>
                <td><input type="number" class="item-input area-display" readonly style="background: #f0f0f0;"></td>
                <td class="item-total">0.00</td>
            `;
        }

        // حذف صنف
        function removeItem(button) {
            button.closest('tr').remove();
            calculateTotals();
        }

        // حساب صف واحد
        function calculateRow(input) {
            const row = input.closest('tr');
            const length = parseFloat(row.querySelector('.length-input').value) || 0;
            const width = parseFloat(row.querySelector('.width-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            
            const area = (length * width).toFixed(3);
            const total = (area * price).toFixed(2);
            
            row.querySelector('.area-display').value = area;
            row.querySelector('.item-total').textContent = total;
            
            calculateTotals();
        }

        // حساب الإجمالي
        function calculateTotals() {
            const tbody = document.getElementById('itemsBody');
            let subtotal = 0;

            tbody.querySelectorAll('tr').forEach(row => {
                const total = parseFloat(row.querySelector('.item-total').textContent) || 0;
                subtotal += total;
            });

            const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            const taxAmount = (subtotal * taxRate / 100).toFixed(2);
            const finalTotal = (subtotal + parseFloat(taxAmount)).toFixed(2);

            document.getElementById('subtotal').textContent = subtotal.toFixed(2);
            document.getElementById('taxAmount').textContent = taxAmount;
            document.getElementById('total').textContent = finalTotal;
        }

        // طباعة الفاتورة
        function printInvoice() {
            window.print();
        }

        // إعادة تعيين النموذج
        function resetForm() {
            if (confirm('هل أنت متأكد من رغبتك في إعادة تعيين جميع البيانات؟')) {
                document.getElementById('customerName').value = '';
                document.getElementById('notes').value = '';
                document.getElementById('taxRate').value = '0';
                document.getElementById('itemsBody').innerHTML = '';
                calculateTotals();
                addItem(); // إضافة صف فارغ واحد
                document.getElementById('invoiceDate').valueAsDate = new Date();
            }
        }

        // إضافة صنف فارغ عند التحميل
        addItem();
    </script>
</body>
</html>
